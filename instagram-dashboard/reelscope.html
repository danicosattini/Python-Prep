La cuenta es de una soci\xF3loga, investigadora y escritora que publica sobre escritura y literatura. Sus objetivos: (1, principal) atraer alumnos para talleres de escritura y mentor\xEDas editoriales; (2) crecer: que la descubra gente nueva, la siga, comparta y comente.

Respond\xE9 solo con un objeto JSON con estas claves:
- "textos": lista de strings, una por imagen y en el mismo orden, con el texto que se lee en esa imagen transcripto literalmente ("" si no tiene texto).
- "portada": objeto con "legible" (true o false: si el texto de la primera imagen se lee bien en el celular) y "comentario" (una frase: si frena el scroll y por qu\xE9).
- "aparece_persona": "si" o "no" (si se ve la cara o las manos de la autora).
- "muestra_proceso": true o false (si se ve su manuscrito, escritorio, cuaderno, libros o pantalla escribiendo).
- "texto_en_pantalla": true o false (si hay texto sobreimpreso legible).
